<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Hub | Dirección General</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <style>
        :root {
            --bg-body: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --border-color: #E2E8F0;
            --theme-color: #1E3A8A; 
            --theme-light: #EFF6FF;
            --header-bg: #0F172A;
        }

        body { background-color: var(--bg-body); font-family: 'Plus Jakarta Sans', sans-serif; color: var(--text-main); -webkit-font-smoothing: antialiased; }
        
        .navbar { background: var(--header-bg); padding: 16px 32px; border-bottom: 1px solid #1E293B; }
        .navbar-brand { font-weight: 800; letter-spacing: -0.6px; font-size: 1.30rem; color: #FFFFFF !important; }
        .executive-tag { background: rgba(255,255,255,0.10); color: #94A3B8; font-size: 0.72rem; font-weight: 700; padding: 4px 10px; border-radius: 6px; letter-spacing: 1px; text-transform: uppercase; margin-left: 12px; }

        .nav-tabs { border-bottom: 1px solid var(--border-color); margin-bottom: 24px; }
        .nav-tabs .nav-link { color: var(--text-muted); font-weight: 700; padding: 14px 28px; border: none; border-bottom: 3px solid transparent; transition: all 0.2s ease; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.6px; }
        .nav-tabs .nav-link:hover { color: var(--text-main); }
        .nav-tabs .nav-link.active { color: var(--theme-color); background: transparent; border-bottom: 3px solid var(--theme-color); }

        .glass-panel { background: var(--card-bg); border-radius: 14px; padding: 22px; box-shadow: 0px 1px 3px rgba(15, 23, 42, 0.05), 0px 10px 25px-5px rgba(15, 23, 42, 0.03); margin-bottom: 22px; border: 1px solid var(--border-color); }
        
        .form-label { font-weight: 800; font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; }
        .form-select, .form-control { border-radius: 8px; border: 1px solid var(--border-color); padding: 8px 12px; font-weight: 600; font-size: 0.82rem; color: var(--text-main); background-color: #FFFFFF; }
        .form-select:focus, .form-control:focus { border-color: var(--theme-color); box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1); }
        
        .btn-primary { background-color: #0F172A; border: none; border-radius: 8px; padding: 9px 18px; font-weight: 700; font-size: 0.82rem; transition: all 0.2s; color: #FFFFFF; }
        .btn-primary:hover { background-color: #1E293B; transform: translateY(-1px); }

        .btn-outline-export { border: 1px solid var(--border-color); color: var(--text-main); background: #FFFFFF; border-radius: 8px; padding: 6px 14px; font-weight: 700; font-size: 0.78rem; transition: all 0.2s; }
        .btn-outline-export:hover { background: #F1F5F9; border-color: #CBD5E1; }

        .kpi-wrapper { display: flex; align-items: center; justify-content: space-between; overflow: hidden; }
        .kpi-info { display: flex; flex-direction: column; min-width: 0; }
        .kpi-title { font-size: 0.68rem; color: var(--text-muted); font-weight: 800; text-transform: uppercase; margin-bottom: 4px; letter-spacing: 0.6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .kpi-value { font-size: 1.50rem; font-weight: 800; color: var(--text-main); margin: 0; line-height: 1.1; letter-spacing: -0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .kpi-icon-box { width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.15rem; color: var(--theme-color); background-color: var(--theme-light); flex-shrink: 0; margin-left: 8px; }

        .section-title { font-weight: 800; font-size: 0.95rem; color: var(--text-main); margin-bottom: 0; display: flex; align-items: center; letter-spacing: -0.2px; }
        
        .table-container { max-height: 420px; overflow-y: auto; border-radius: 8px; border: 1px solid var(--border-color); }
        table { width: 100%; border-collapse: separate; border-spacing: 0; }
        table thead th { position: sticky; top: 0; background-color: #F8FAFC !important; color: var(--text-muted) !important; font-weight: 800; font-size: 0.66rem; text-transform: uppercase; padding: 12px 14px; border-bottom: 1px solid var(--border-color); z-index: 1; letter-spacing: 0.8px; }
        table tbody td { font-size: 0.82rem; color: var(--text-main); font-weight: 600; padding: 11px 14px; border-bottom: 1px solid #F1F5F9; vertical-align: middle; }
        table tbody tr:hover { background-color: #F8FAFC; }
        
        .pill-badge { font-size: 0.70rem; padding: 3px 8px; border-radius: 6px; font-weight: 700; display: inline-block; }
        .pill-success { background-color: #F0FDF4; color: #166534; border: 1px solid #BBF7D0; }
        .pill-warning { background-color: #FFFBEB; color: #92400E; border: 1px solid #FDE68A; }
        .pill-danger { background-color: #FEF2F2; color: #991B1B; border: 1px solid #FECACA; }

        #loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; backdrop-filter: blur(6px); }
        .spinner-custom { color: #0F172A; width: 3.0rem; height: 3.0rem; border-width: 4px; }
    </style>
</head>
<body class="module-inbound">

<div id="loading-overlay">
    <div class="spinner-border spinner-custom" role="status"></div>
    <h6 class="mt-3 fw-bold" style="color: var(--text-main);">Cargando Datos de Dirección...</h6>
</div>

<nav class="navbar navbar-expand-lg">
    <div class="container-fluid px-4">
        <a class="navbar-brand d-flex align-items-center" href="#">
            <i class="bi bi-layers-fill me-2 text-primary"></i> Analytics Hub 
            <span class="executive-tag">C-Level Board</span>
        </a>
        <span class="text-light fw-medium fs-6 opacity-75" id="current-date"></span>
    </div>
</nav>

<div class="container-fluid px-4 pb-5 pt-4">
    
    <ul class="nav nav-tabs" id="myTab" role="tablist">
        <li class="nav-item"><button class="nav-link active" id="inbound-tab"><i class="bi bi-headset me-2"></i> Inbound</button></li>
        <li class="nav-item"><button class="nav-link" id="outbound-tab"><i class="bi bi-telephone-outbound me-2"></i> Outbound</button></li>
        <li class="nav-item"><button class="nav-link" id="chat-tab"><i class="bi bi-chat-dots me-2"></i> Chat Digital</button></li>
    </ul>

    <!-- Panel de Filtros -->
    <div class="glass-panel">
        <div class="row align-items-end g-3">
            <div class="col-md-2">
                <label class="form-label"><i class="bi bi-calendar-event me-1"></i> Desde</label>
                <input type="date" id="fecha-inicio" class="form-control">
            </div>
            <div class="col-md-2">
                <label class="form-label"><i class="bi bi-calendar-event me-1"></i> Hasta</label>
                <input type="date" id="fecha-fin" class="form-control">
            </div>
            <div class="col-md-3">
                <label class="form-label" id="label-campana"><i class="bi bi-funnel me-1"></i> Campaña</label>
                <select id="filter-campana" class="form-select"><option value="ALL">Todas</option></select>
            </div>
            <div class="col-md-3">
                <label class="form-label" id="label-ring"><i class="bi bi-telephone me-1"></i> Ring Group</label>
                <select id="filter-ring" class="form-select"><option value="ALL">Todos</option></select>
            </div>
            <div class="col-md-2 text-end">
                <button class="btn btn-primary w-100 shadow-sm" onclick="applyFilters()">
                    <i class="bi bi-search me-1"></i> Actualizar
                </button>
            </div>
        </div>
    </div>

    <!-- KPIs -->
    <div class="row g-3 mb-4" id="kpi-container">
        <div class="col-xl-2 col-md-4 col-sm-6" id="card-1"><div class="glass-panel p-3 h-100 kpi-wrapper"><div class="kpi-info"><span class="kpi-title" id="kpi-t1">Recibidas</span><span class="kpi-value" id="kpi-v1">0</span></div><div class="kpi-icon-box"><i id="kpi-i1" class="bi bi-telephone-inbound-fill"></i></div></div></div>
        <div class="col-xl-2 col-md-4 col-sm-6" id="card-2"><div class="glass-panel p-3 h-100 kpi-wrapper"><div class="kpi-info"><span class="kpi-title" id="kpi-t2">Atendidas</span><span class="kpi-value" id="kpi-v2">0</span></div><div class="kpi-icon-box text-success" style="background:#F0FDF4;"><i id="kpi-i2" class="bi bi-check-circle-fill"></i></div></div></div>
        <div class="col-xl-2 col-md-4 col-sm-6" id="card-3"><div class="glass-panel p-3 h-100 kpi-wrapper"><div class="kpi-info"><span class="kpi-title" id="kpi-t3">Pérdidas</span><span class="kpi-value" id="kpi-v3">0</span></div><div class="kpi-icon-box text-danger" style="background:#FEF2F2;"><i id="kpi-i3" class="bi bi-telephone-x-fill"></i></div></div></div>
        <div class="col-xl-2 col-md-4 col-sm-6" id="card-4"><div class="glass-panel p-3 h-100 kpi-wrapper"><div class="kpi-info"><span class="kpi-title" id="kpi-t4">% Abandono</span><span class="kpi-value" id="kpi-v4">0%</span></div><div class="kpi-icon-box text-warning" style="background:#FFFBEB;"><i id="kpi-i4" class="bi bi-graph-down-arrow"></i></div></div></div>
        <div class="col-xl-2 col-md-4 col-sm-6" id="card-5"><div class="glass-panel p-3 h-100 kpi-wrapper"><div class="kpi-info"><span class="kpi-title" id="kpi-t5">SLA Global</span><span class="kpi-value" id="kpi-v5">0%</span></div><div class="kpi-icon-box text-info" style="background:#EFF6FF;"><i id="kpi-i5" class="bi bi-award-fill"></i></div></div></div>
        <div class="col-xl-2 col-md-4 col-sm-6" id="card-6"><div class="glass-panel p-3 h-100 kpi-wrapper"><div class="kpi-info"><span class="kpi-title" id="kpi-t6">AHT / ASA</span><span class="kpi-value fs-6" id="kpi-v6">00:00 / 00:00</span></div><div class="kpi-icon-box text-secondary" style="background:#F1F5F9;"><i id="kpi-i6" class="bi bi-clock-history"></i></div></div></div>
    </div>

    <!-- Gráfica Corregida -->
    <div class="row mb-4">
        <div class="col-12"><div class="glass-panel pb-3">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="section-title"><i class="bi bi-graph-up me-2 fs-5 text-primary"></i> Tendencia Operativa Cronológica por Horario</h5>
            </div>
            <div style="height: 360px; width: 100%; position: relative;"><canvas id="intervalChart"></canvas></div>
        </div></div>
    </div>

    <!-- Tabla -->
    <div class="row">
        <div class="col-12"><div class="glass-panel">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="section-title"><i class="bi bi-table me-2 fs-5 text-primary"></i> Desglose Detallado por Intervalos (30 Min)</h5>
                <button class="btn btn-outline-export" onclick="exportTableToCSV()">
                    <i class="bi bi-download me-1"></i> Descargar Excel
                </button>
            </div>
            <div class="table-container">
                <table class="table text-center" id="data-table">
                    <thead><tr id="table-head-row"></tr></thead>
                    <tbody id="tabla-body"></tbody>
                </table>
            </div>
        </div></div>
    </div>
</div>

<script>
    document.getElementById('current-date').innerText = new Date().toLocaleDateString('es-MX', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

    const EXCEL_FILE = 'Indicadores Mensuales Servicios.xlsx'; 
    
    let excelWorkbook = null; 
    let myChart = null; 
    let currentData = [];
    let currentFilteredIntervalData = []; 
    let currentModule = 'INBOUND';

    function formatSeconds(seconds) {
        if (isNaN(seconds) || seconds === null || seconds === undefined) return "00:00";
        let s = Math.round(parseFloat(seconds));
        if (s <= 0) return "00:00";

        let hrs = Math.floor(s / 3600);
        let mins = Math.floor((s % 3600) / 60);
        let secs = s % 60;

        let strMins = mins < 10 ? "0" + mins : mins;
        let strSecs = secs < 10 ? "0" + secs : secs;

        if (hrs > 0) {
            let strHrs = hrs < 10 ? "0" + hrs : hrs;
            return `${strHrs}:${strMins}:${strSecs}`;
        }
        return `${strMins}:${strSecs}`;
    }

    function parseDateStr(dateStr) {
        if(!dateStr) return null;
        if(typeof dateStr === 'number') return new Date((dateStr - (25567 + 2)) * 86400 * 1000);
        const partes = dateStr.toString().split(/[/-]/);
        if(partes.length === 3) return new Date(partes[2].length === 4 ? partes[2] : '20'+partes[2], partes[1] - 1, partes[0]);
        return new Date(dateStr);
    }

    // CONVERSIÓN CRONOLÓGICA CORRECTA DE INTERVALO A MINUTOS REALES
    function timeToMinutes(timeStr) {
        if (!timeStr) return 0;
        let str = timeStr.toString().trim();
        let parts = str.split(':');
        if (parts.length >= 2) {
            let h = parseInt(parts[0], 10) || 0;
            let m = parseInt(parts[1], 10) || 0;
            return h * 60 + m;
        }
        return 0;
    }

    async function loadModule(moduleName) {
        document.getElementById('loading-overlay').style.display = 'flex';
        
        document.querySelectorAll('.nav-link').forEach(btn => btn.classList.remove('active'));
        document.getElementById(moduleName.toLowerCase() + '-tab').classList.add('active');
        document.body.className = `module-${moduleName.toLowerCase()}`;

        currentModule = moduleName;

        try {
            if (!excelWorkbook) {
                const response = await fetch(EXCEL_FILE + '?v=' + new Date().getTime());
                if (!response.ok) throw new Error(`No se encontró el archivo ${EXCEL_FILE}.`);
                const arrayBuffer = await response.arrayBuffer();
                excelWorkbook = XLSX.read(arrayBuffer, {type: 'array'});
            }

            let sheetName = moduleName === 'INBOUND' ? 'Inbound' : (moduleName === 'OUTBOUND' ? 'Outbound' : 'Chat');
            if (!excelWorkbook.Sheets[sheetName]) throw new Error(`La pestaña "${sheetName}" no existe.`);

            currentData = XLSX.utils.sheet_to_json(excelWorkbook.Sheets[sheetName], {raw: false});
        } catch (error) {
            console.error("Error:", error);
            alert("Error: " + error.message);
            document.getElementById('loading-overlay').style.display = 'none';
            return;
        }
        
        configurarUI(moduleName);
        populateFilters();
        applyFilters();
        document.getElementById('loading-overlay').style.display = 'none';
    }

    function configurarUI(modulo) {
        const tHead = document.getElementById('table-head-row');
        
        if(modulo === 'INBOUND') {
            document.getElementById('card-3').style.display = 'block'; document.getElementById('card-4').style.display = 'block'; document.getElementById('card-5').style.display = 'block'; document.getElementById('card-6').style.display = 'block';
            
            document.getElementById('label-campana').innerHTML = '<i class="bi bi-funnel me-1"></i> Campaña';
            document.getElementById('label-ring').innerHTML = '<i class="bi bi-telephone me-1"></i> Ring Group';

            document.getElementById('kpi-t1').innerText = 'Recibidas'; document.getElementById('kpi-i1').className = 'bi bi-telephone-inbound-fill';
            document.getElementById('kpi-t2').innerText = 'Atendidas'; document.getElementById('kpi-i2').className = 'bi bi-check-circle-fill';
            document.getElementById('kpi-t3').innerText = 'Abandonadas'; document.getElementById('kpi-i3').className = 'bi bi-telephone-x-fill';
            document.getElementById('kpi-t4').innerText = '% Abandono'; document.getElementById('kpi-i4').className = 'bi bi-graph-down-arrow';
            document.getElementById('kpi-t6').innerText = 'AHT / ASA';
            
            tHead.innerHTML = `<th>Intervalo</th><th>Recibidas</th><th>Atendidas</th><th>Abandonadas</th><th>% Abandono</th><th>SLA Global</th><th>AHT</th><th>ASA</th>`;
        } 
        else if (modulo === 'OUTBOUND') {
            document.getElementById('card-3').style.display = 'none'; document.getElementById('card-4').style.display = 'none'; document.getElementById('card-5').style.display = 'none'; 
            
            document.getElementById('label-campana').innerHTML = '<i class="bi bi-list-task me-1"></i> Campaña';
            document.getElementById('label-ring').innerHTML = '<i class="bi bi-headset me-1"></i> Ring Group';

            document.getElementById('kpi-t1').innerText = 'Llamadas Realizadas'; document.getElementById('kpi-i1').className = 'bi bi-telephone-outbound-fill';
            document.getElementById('kpi-t2').innerText = 'AHT Global'; document.getElementById('kpi-i2').className = 'bi bi-clock-history';
            document.getElementById('card-6').style.display = 'none'; 
            
            tHead.innerHTML = `<th>Intervalo</th><th>Llamadas Realizadas</th><th>AHT</th>`;
        } 
        else if (modulo === 'CHAT') {
            document.getElementById('card-3').style.display = 'block'; document.getElementById('card-4').style.display = 'block'; document.getElementById('card-5').style.display = 'block'; document.getElementById('card-6').style.display = 'block';
            
            document.getElementById('label-campana').innerHTML = '<i class="bi bi-chat-square-text me-1"></i> Campaña';
            document.getElementById('label-ring').innerHTML = '<i class="bi bi-robot me-1"></i> Nombre del Bot';

            document.getElementById('kpi-t1').innerText = 'Chats Entrantes'; document.getElementById('kpi-i1').className = 'bi bi-chat-left-dots-fill';
            document.getElementById('kpi-t2').innerText = 'Chats Atendidos'; document.getElementById('kpi-i2').className = 'bi bi-chat-dots-fill';
            document.getElementById('kpi-t3').innerText = 'Abandonados'; document.getElementById('kpi-i3').className = 'bi bi-chat-square-quote-fill';
            document.getElementById('kpi-t4').innerText = '% Abandono'; document.getElementById('kpi-i4').className = 'bi bi-graph-down-arrow';
            document.getElementById('kpi-t6').innerText = 'AHT Global'; 
            
            tHead.innerHTML = `<th>Intervalo</th><th>Chats Entrantes</th><th>Chats Atendidos</th><th>Abandonados</th><th>% Abandono</th><th>SLA Global</th><th>AHT</th>`;
        }
    }

    function populateFilters() {
        const campanas = new Set(); const rings = new Set();
        currentData.forEach(row => {
            if(row['Campaña']) campanas.add(row['Campaña']);
            if(row['Ring Group'] || row['Nombre del Bot']) rings.add(row['Ring Group'] || row['Nombre del Bot']);
        });

        const fCamp = document.getElementById('filter-campana');
        const fRing = document.getElementById('filter-ring');
        
        fCamp.innerHTML = '<option value="ALL">Todas</option>';
        fRing.innerHTML = '<option value="ALL">Todos</option>';

        campanas.forEach(v => { fCamp.innerHTML += `<option value="${v}">${v}</option>`; });
        rings.forEach(v => { fRing.innerHTML += `<option value="${v}">${v}</option>`; });
    }

    function applyFilters() {
        const dInicio = document.getElementById('fecha-inicio').value;
        const dFin = document.getElementById('fecha-fin').value;
        const selCamp = document.getElementById('filter-campana').value;
        const selRing = document.getElementById('filter-ring').value;

        let dateStart = dInicio ? new Date(dInicio + 'T00:00:00') : null;
        let dateEnd = dFin ? new Date(dFin + 'T23:59:59') : null;

        const filteredData = currentData.filter(row => {
            let rowDate = parseDateStr(row.Fecha);
            let inDateRange = true;
            if(dateStart && rowDate < dateStart) inDateRange = false;
            if(dateEnd && rowDate > dateEnd) inDateRange = false;

            let rowCamp = row['Campaña'];
            let rowRing = row['Ring Group'] || row['Nombre del Bot'];

            return inDateRange &&
                   (selCamp === 'ALL' || rowCamp === selCamp) &&
                   (selRing === 'ALL' || rowRing === selRing);
        });
        processData(filteredData);
    }

    function processData(data) {
        let tRec = 0, tAten = 0, tSLA = 0, tAban = 0, sumAHT = 0, sumASA = 0;
        const intMap = {};

        data.forEach(row => {
            const rec = parseFloat(row['Recibidas']) || parseFloat(row['Realizadas']) || parseFloat(row['Recibidos']) || 0;
            const aten = parseFloat(row['Atendidas']) || parseFloat(row['Atendidos']) || 0;
            const atenSLA = parseFloat(row['Atendidas_SLA']) || parseFloat(row['Atendidos_SLA']) || 0;
            const aban = parseFloat(row['Abandonadas_Total']) || parseFloat(row['Abandonados']) || 0;
            const aht = parseFloat(row['AHT']) || 0;
            const asa = parseFloat(row['ASA']) || 0; 

            tRec += rec; tAten += aten; tSLA += atenSLA; tAban += aban;
            
            let baseAHT = (currentModule === 'OUTBOUND') ? rec : aten;
            sumAHT += (aht * baseAHT); 
            sumASA += (asa * aten);

            let rawIntv = row['Intervalo'] || '00:00';
            let formattedIntv = rawIntv.toString().trim();
            if(formattedIntv.length === 4 && formattedIntv.includes(':')) formattedIntv = '0' + formattedIntv;

            if(!intMap[formattedIntv]) intMap[formattedIntv] = { rec: 0, aten: 0, atenSLA: 0, aban: 0, sumAHT: 0, sumASA: 0 };
            intMap[formattedIntv].rec += rec; intMap[formattedIntv].aten += aten; intMap[formattedIntv].atenSLA += atenSLA; intMap[formattedIntv].aban += aban;
            intMap[formattedIntv].sumAHT += (aht * baseAHT); intMap[formattedIntv].sumASA += (asa * aten);
        });

        const tbody = document.getElementById('tabla-body'); tbody.innerHTML = '';
        const labels = [], dRec = [], dAte = [], dAban = [];
        currentFilteredIntervalData = []; 

        // ORDENAMIENTO CRONOLÓGICO REAL
        const sortedIntervals = Object.keys(intMap).sort((a, b) => timeToMinutes(a) - timeToMinutes(b));

        if (currentModule === 'OUTBOUND') {
            document.getElementById('kpi-v1').innerText = tRec.toLocaleString();
            let avgAHT = tRec > 0 ? (sumAHT / tRec) : 0;
            document.getElementById('kpi-v2').innerText = formatSeconds(avgAHT); 
            
            sortedIntervals.forEach(intv => {
                const d = intMap[intv];
                labels.push(intv); dRec.push(d.rec);
                const rAHT = d.rec > 0 ? (d.sumAHT / d.rec) : 0;
                
                tbody.innerHTML += `<tr><td class="fw-bold">${intv}</td><td class="text-primary fw-bold">${d.rec.toLocaleString()}</td><td class="fw-bold text-secondary">${formatSeconds(rAHT)}</td></tr>`;
                
                currentFilteredIntervalData.push({
                    "Intervalo": intv,
                    "Llamadas Realizadas": d.rec,
                    "AHT": formatSeconds(rAHT)
                });
            });
            renderChart(labels, dRec, [], []);
        } 
        else {
            document.getElementById('kpi-v1').innerText = tRec.toLocaleString();
            document.getElementById('kpi-v2').innerText = tAten.toLocaleString();
            document.getElementById('kpi-v3').innerText = tAban.toLocaleString();
            document.getElementById('kpi-v4').innerText = (tRec > 0 ? ((tAban / tRec) * 100).toFixed(1) : 0) + '%';
            document.getElementById('kpi-v5').innerText = (tRec > 0 ? ((tSLA / tRec) * 100).toFixed(1) : 0) + '%';
            
            let avgAHT = tAten > 0 ? (sumAHT / tAten) : 0;
            let avgASA = tAten > 0 ? (sumASA / tAten) : 0;

            if(currentModule === 'CHAT') {
                document.getElementById('kpi-v6').innerText = formatSeconds(avgAHT);
            } else {
                document.getElementById('kpi-v6').innerText = `${formatSeconds(avgAHT)} / ${formatSeconds(avgASA)}`;
            }

            sortedIntervals.forEach(intv => {
                const d = intMap[intv];
                labels.push(intv); dRec.push(d.rec); dAte.push(d.aten); dAban.push(d.aban);

                const rAba = d.rec > 0 ? ((d.aban / d.rec) * 100).toFixed(1) : 0;
                const rSLA = d.rec > 0 ? ((d.atenSLA / d.rec) * 100).toFixed(1) : 0;
                const rAHT = d.aten > 0 ? (d.sumAHT / d.aten) : 0;
                const rASA = d.aten > 0 ? (d.sumASA / d.aten) : 0;
                
                let pillClass = rSLA >= 80 ? 'pill-success' : (rSLA >= 70 ? 'pill-warning' : 'pill-danger');

                let tdExtra = currentModule === 'CHAT' ? '' : `<td class="fw-semibold text-secondary">${formatSeconds(rASA)}</td>`;
                tbody.innerHTML += `<tr><td class="fw-bold">${intv}</td><td>${d.rec.toLocaleString()}</td><td class="text-success fw-bold">${d.aten.toLocaleString()}</td><td class="text-danger fw-bold">${d.aban.toLocaleString()}</td><td class="fw-semibold">${rAba}%</td><td><span class="pill-badge ${pillClass}">${rSLA}%</span></td><td class="fw-semibold text-secondary">${formatSeconds(rAHT)}</td>${tdExtra}</tr>`;

                let exportRow = {
                    "Intervalo": intv,
                    [currentModule === 'CHAT' ? "Chats Entrantes" : "Recibidas"]: d.rec,
                    [currentModule === 'CHAT' ? "Chats Atendidos" : "Atendidas"]: d.aten,
                    "Abandonadas": d.aban,
                    "% Abandono": `${rAba}%`,
                    "SLA Global": `${rSLA}%`,
                    "AHT": formatSeconds(rAHT)
                };
                if(currentModule !== 'CHAT') exportRow["ASA"] = formatSeconds(rASA);
                currentFilteredIntervalData.push(exportRow);
            });
            renderChart(labels, dRec, dAte, dAban);
        }
    }

    // DISEÑO COMBO C-LEVEL
    function renderChart(labels, dRec, dAte, dAban) {
        const ctx = document.getElementById('intervalChart').getContext('2d');
        if (myChart) myChart.destroy();

        Chart.defaults.font.family = 'Plus Jakarta Sans';
        Chart.defaults.color = '#64748B';

        let datasets = [];

        if (currentModule === 'OUTBOUND') {
            datasets = [{
                type: 'bar',
                label: 'Llamadas Realizadas', 
                data: dRec, 
                backgroundColor: '#D97706',
                borderRadius: 4,
                barPercentage: 0.6
            }];
        } else if (currentModule === 'CHAT') {
            datasets = [
                {
                    type: 'bar',
                    label: 'Chats Entrantes', 
                    data: dRec, 
                    backgroundColor: '#0D948833',
                    borderColor: '#0D9488',
                    borderWidth: 1,
                    borderRadius: 4,
                    barPercentage: 0.6
                },
                {
                    type: 'line',
                    label: 'Atendidos', 
                    data: dAte, 
                    borderColor: '#2563EB', 
                    borderWidth: 2.5, 
                    fill: false, 
                    tension: 0.3, 
                    pointRadius: 0,
                    pointHoverRadius: 5
                },
                {
                    type: 'line',
                    label: 'Abandonos', 
                    data: dAban, 
                    borderColor: '#F43F5E', 
                    borderWidth: 2, 
                    borderDash: [4, 4], 
                    fill: false, 
                    tension: 0.3, 
                    pointRadius: 0
                }
            ];
        } else {
            // INBOUND C-LEVEL (Barras de Volumen + Línea de Atención)
            datasets = [
                {
                    type: 'bar',
                    label: 'Volumen Recibido', 
                    data: dRec, 
                    backgroundColor: '#1E293B33',
                    borderColor: '#1E293B',
                    borderWidth: 1,
                    borderRadius: 4,
                    barPercentage: 0.65
                },
                {
                    type: 'line',
                    label: 'Atendidas', 
                    data: dAte, 
                    borderColor: '#2563EB', 
                    borderWidth: 2.5, 
                    fill: false, 
                    tension: 0.3, 
                    pointRadius: 0,
                    pointHoverRadius: 5
                },
                {
                    type: 'line',
                    label: 'Abandonadas', 
                    data: dAban, 
                    borderColor: '#F43F5E', 
                    borderWidth: 2, 
                    borderDash: [4, 4], 
                    fill: false, 
                    tension: 0.3, 
                    pointRadius: 0
                }
            ];
        }

        myChart = new Chart(ctx, {
            data: { labels: labels, datasets: datasets },
            options: { 
                responsive: true, maintainAspectRatio: false, 
                interaction: { mode: 'index', intersect: false },
                plugins: { 
                    legend: { position: 'top', align: 'end', labels: { usePointStyle: true, boxWidth: 8, padding: 18, font: { weight: '700', size: 12 } } },
                    tooltip: { 
                        backgroundColor: '#FFFFFF', titleColor: '#0F172A', bodyColor: '#0F172A', borderColor: '#E2E8F0', borderWidth: 1, 
                        padding: 12, boxPadding: 6, usePointStyle: true, titleFont: {size: 13, weight: '800'}, bodyFont: {size: 12, weight: '600'}, 
                        cornerRadius: 10, displayColors: true, shadowOffsetX: 0, shadowOffsetY: 6, shadowBlur: 14, shadowColor: 'rgba(15, 23, 42, 0.08)' 
                    }
                },
                scales: { 
                    y: { beginAtZero: true, border: {display: false}, grid: { color: '#F1F5F9', drawTicks: false }, ticks: { font: { weight: '600' } } }, 
                    x: { border: {display: false}, grid: { display: false, drawTicks: false }, ticks: { padding: 8, font: { weight: '600', size: 10 } } } 
                }
            }
        });
    }

    function exportTableToCSV() {
        if(!currentFilteredIntervalData || currentFilteredIntervalData.length === 0) {
            alert("No hay datos cargados para exportar.");
            return;
        }

        const ws = XLSX.utils.json_to_sheet(currentFilteredIntervalData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Intervalos_30min");

        const fileName = `Reporte_${currentModule}_Intervalos_30min.xlsx`;
        XLSX.writeFile(wb, fileName);
    }

    document.getElementById('inbound-tab').addEventListener('click', () => loadModule('INBOUND'));
    document.getElementById('outbound-tab').addEventListener('click', () => loadModule('OUTBOUND'));
    document.getElementById('chat-tab').addEventListener('click', () => loadModule('CHAT'));

    loadModule('INBOUND');
</script>
</body>
</html>
