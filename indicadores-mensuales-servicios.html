<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Hub | Dashboard Ejecutivo</title>
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <style>
        :root {
            --bg-body: #F4F7FE;
            --card-bg: #FFFFFF;
            --text-main: #1B2559;
            --text-muted: #A3AED0;
            --theme-color: #4318FF; 
            --theme-light: #F4F7FE;
            --theme-gradient: linear-gradient(135deg, #868CFF 0%, #4318FF 100%);
        }

        body { background-color: var(--bg-body); font-family: 'Plus Jakarta Sans', sans-serif; color: var(--text-main); }
        
        /* Navbar de Impacto */
        .navbar { transition: all 0.4s ease; padding: 18px 28px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); }
        .navbar-brand { font-weight: 800; letter-spacing: -0.5px; font-size: 1.5rem; color: #fff !important; }
        
        body.module-inbound { --theme-color: #4318FF; --theme-light: #F4F7FE; --theme-gradient: linear-gradient(135deg, #4318FF 0%, #2A09B0 100%); }
        body.module-inbound .navbar { background: var(--theme-gradient); }
        
        body.module-outbound { --theme-color: #FF8F00; --theme-light: #FFF8F0; --theme-gradient: linear-gradient(135deg, #FF8F00 0%, #D86000 100%); }
        body.module-outbound .navbar { background: var(--theme-gradient); }
        
        body.module-chat { --theme-color: #01B574; --theme-light: #E6F8F2; --theme-gradient: linear-gradient(135deg, #01B574 0%, #007D50 100%); }
        body.module-chat .navbar { background: var(--theme-gradient); }

        /* Pestañas Ejecutivas */
        .nav-tabs { border-bottom: 2px solid #E9EDF7; margin-bottom: 28px; }
        .nav-tabs .nav-link { color: var(--text-muted); font-weight: 700; padding: 14px 28px; border: none; border-bottom: 3px solid transparent; transition: all 0.3s ease; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.5px;}
        .nav-tabs .nav-link:hover { color: var(--text-main); }
        .nav-tabs .nav-link.active { color: var(--theme-color); background: transparent; border-bottom: 3px solid var(--theme-color); }

        /* Tarjetas Neumórficas Suaves */
        .glass-panel { background: var(--card-bg); border-radius: 20px; padding: 25px; box-shadow: 0px 18px 40px rgba(112, 144, 176, 0.08); margin-bottom: 25px; border: 1px solid rgba(229, 234, 243, 0.7); transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .glass-panel:hover { transform: translateY(-2px); box-shadow: 0px 22px 45px rgba(112, 144, 176, 0.12); }
        
        .form-label { font-weight: 800; font-size: 0.70rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px;}
        .form-select, .form-control { border-radius: 14px; border: 1px solid #E9EDF7; padding: 12px 16px; font-weight: 600; color: var(--text-main); background-color: #F8FAFC;}
        .form-select:focus, .form-control:focus { border-color: var(--theme-color); box-shadow: 0 0 0 0.25rem var(--theme-light); }
        .btn-primary { background: var(--theme-gradient); border: none; border-radius: 14px; padding: 12px 24px; font-weight: 700; transition: all 0.3s; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(67, 24, 255, 0.25); filter: brightness(1.05); }

        /* Tarjetas KPIs Premium */
        .kpi-wrapper { display: flex; align-items: center; justify-content: space-between; }
        .kpi-info { display: flex; flex-direction: column; }
        .kpi-title { font-size: 0.75rem; color: var(--text-muted); font-weight: 800; text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.8px;}
        .kpi-value { font-size: 2.2rem; font-weight: 800; color: var(--text-main); margin: 0; line-height: 1; letter-spacing: -1.2px;}
        .kpi-icon-box { width: 56px; height: 56px; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; color: var(--theme-color); background-color: var(--theme-light); transition: all 0.3s ease; }

        /* Sección Títulos */
        .section-title { font-weight: 800; font-size: 1.15rem; color: var(--text-main); margin-bottom: 22px; display: flex; align-items: center; letter-spacing: -0.4px;}
        
        /* Tabla Ejecutiva */
        .table-container { max-height: 480px; overflow-y: auto; border-radius: 14px; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; }
        table thead th { position: sticky; top: 0; background-color: #F4F7FE !important; color: var(--text-muted) !important; font-weight: 800; font-size: 0.75rem; text-transform: uppercase; padding: 18px; border-bottom: 2px solid #E9EDF7; z-index: 1; letter-spacing: 0.8px;}
        table tbody td { font-size: 0.92rem; color: var(--text-main); font-weight: 600; padding: 18px; border-bottom: 1px solid #F0F3F8; vertical-align: middle; }
        table tbody tr:hover { background-color: #F8FAFC; }
        .badge-sla { font-size: 0.82rem; padding: 0.6em 0.9em; border-radius: 8px; font-weight: 800; }

        #loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; backdrop-filter: blur(10px); }
        .spinner-custom { color: var(--theme-color); width: 4rem; height: 4rem; border-width: 5px;}
    </style>
</head>
<body class="module-inbound">

<div id="loading-overlay">
    <div class="spinner-border spinner-custom" role="status"></div>
    <h5 class="mt-4 fw-bold" style="color: var(--text-main); letter-spacing:-0.5px;">Sincronizando Indicadores Ejecutivos...</h5>
</div>

<nav class="navbar navbar-expand-lg">
    <div class="container-fluid px-4">
        <a class="navbar-brand" href="#"><i class="bi bi-grid-1x2-fill me-2"></i> Analytics Hub <span class="fw-light opacity-75">| Operaciones</span></a>
        <span class="text-light fw-medium fs-6 opacity-75" id="current-date"></span>
    </div>
</nav>

<div class="container-fluid px-4 pb-5 pt-4">
    
    <ul class="nav nav-tabs" id="myTab" role="tablist">
        <li class="nav-item"><button class="nav-link active" id="inbound-tab"><i class="bi bi-headset me-2"></i> Inbound</button></li>
        <li class="nav-item"><button class="nav-link" id="outbound-tab"><i class="bi bi-telephone-outbound me-2"></i> Outbound</button></li>
        <li class="nav-item"><button class="nav-link" id="chat-tab"><i class="bi bi-chat-dots me-2"></i> Chat Digital</button></li>
    </ul>

    <!-- Panel de Filtros -->
    <div class="glass-panel">
        <div class="row align-items-end g-3">
            <div class="col-md-2">
                <label class="form-label"><i class="bi bi-calendar-event me-1"></i> Desde</label>
                <input type="date" id="fecha-inicio" class="form-control">
            </div>
            <div class="col-md-2">
                <label class="form-label"><i class="bi bi-calendar-event me-1"></i> Hasta</label>
                <input type="date" id="fecha-fin" class="form-control">
            </div>
            <div class="col-md-3">
                <label class="form-label" id="label-campana"><i class="bi bi-funnel me-1"></i> Campaña</label>
                <select id="filter-campana" class="form-select"><option value="ALL">Todas</option></select>
            </div>
            <div class="col-md-3">
                <label class="form-label" id="label-ring"><i class="bi bi-telephone me-1"></i> Ring Group</label>
                <select id="filter-ring" class="form-select"><option value="ALL">Todos</option></select>
            </div>
            <div class="col-md-2 text-end">
                <button class="btn btn-primary w-100 shadow-sm" onclick="applyFilters()">
                    <i class="bi bi-search me-1"></i> Analizar
                </button>
            </div>
        </div>
    </div>

    <!-- Tarjetas de KPIs Dinámicas -->
    <div class="row g-4 mb-4" id="kpi-container">
        <div class="col-xl-2 col-md-4 col-sm-6" id="card-1"><div class="glass-panel p-4 h-100 kpi-wrapper"><div class="kpi-info"><span class="kpi-title" id="kpi-t1">Recibidas</span><span class="kpi-value" id="kpi-v1">0</span></div><div class="kpi-icon-box"><i id="kpi-i1" class="bi bi-telephone-inbound"></i></div></div></div>
        <div class="col-xl-2 col-md-4 col-sm-6" id="card-2"><div class="glass-panel p-4 h-100 kpi-wrapper"><div class="kpi-info"><span class="kpi-title" id="kpi-t2">Atendidas</span><span class="kpi-value" id="kpi-v2">0</span></div><div class="kpi-icon-box text-success" style="background:#E6F8F2;"><i id="kpi-i2" class="bi bi-check-circle-fill"></i></div></div></div>
        <div class="col-xl-2 col-md-4 col-sm-6" id="card-3"><div class="glass-panel p-4 h-100 kpi-wrapper"><div class="kpi-info"><span class="kpi-title" id="kpi-t3">Pérdidas</span><span class="kpi-value" id="kpi-v3">0</span></div><div class="kpi-icon-box text-danger" style="background:#FFEBEB;"><i id="kpi-i3" class="bi bi-telephone-x-fill"></i></div></div></div>
        <div class="col-xl-2 col-md-4 col-sm-6" id="card-4"><div class="glass-panel p-4 h-100 kpi-wrapper"><div class="kpi-info"><span class="kpi-title" id="kpi-t4">% Abandono</span><span class="kpi-value" id="kpi-v4">0%</span></div><div class="kpi-icon-box text-warning" style="background:#FFF8F0;"><i id="kpi-i4" class="bi bi-graph-down-arrow"></i></div></div></div>
        <div class="col-xl-2 col-md-4 col-sm-6" id="card-5"><div class="glass-panel p-4 h-100 kpi-wrapper"><div class="kpi-info"><span class="kpi-title" id="kpi-t5">SLA Global</span><span class="kpi-value" id="kpi-v5">0%</span></div><div class="kpi-icon-box text-info" style="background:#E5F4FF;"><i id="kpi-i5" class="bi bi-award-fill"></i></div></div></div>
        <div class="col-xl-2 col-md-4 col-sm-6" id="card-6"><div class="glass-panel p-4 h-100 kpi-wrapper"><div class="kpi-info"><span class="kpi-title" id="kpi-t6">AHT / ASA</span><span class="kpi-value fs-4" id="kpi-v6">00:00 / 00:00</span></div><div class="kpi-icon-box text-secondary" style="background:#F0F3F8;"><i id="kpi-i6" class="bi bi-stopwatch-fill"></i></div></div></div>
    </div>

    <!-- Gráfica Machín -->
    <div class="row mb-4">
        <div class="col-12"><div class="glass-panel pb-3">
            <h5 class="section-title"><i class="bi bi-activity me-2 fs-5" style="color:var(--theme-color);"></i> Comportamiento de la Operación por Intervalo</h5>
            <div style="height: 390px; width: 100%; position: relative;"><canvas id="intervalChart"></canvas></div>
        </div></div>
    </div>

    <!-- Tabla Ejecutiva -->
    <div class="row">
        <div class="col-12"><div class="glass-panel">
            <h5 class="section-title"><i class="bi bi-table me-2 fs-5" style="color:var(--theme-color);"></i> Desglose Detallado por Horario</h5>
            <div class="table-container">
                <table class="table text-center" id="data-table">
                    <thead><tr id="table-head-row"></tr></thead>
                    <tbody id="tabla-body"></tbody>
                </table>
            </div>
        </div></div>
    </div>
</div>

<script>
    document.getElementById('current-date').innerText = new Date().toLocaleDateString('es-MX', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

    const EXCEL_FILE = 'Indicadores Mensuales Servicios.xlsx'; 
    
    let excelWorkbook = null; 
    let myChart = null; 
    let currentData = [];
    let currentModule = 'INBOUND';

    // Conversión de Segundos a Formato HH:MM:SS o MM:SS
    function formatSeconds(seconds) {
        if (isNaN(seconds) || seconds === null || seconds === undefined) return "00:00";
        let s = Math.round(parseFloat(seconds));
        if (s <= 0) return "00:00";

        let hrs = Math.floor(s / 3600);
        let mins = Math.floor((s % 3600) / 60);
        let secs = s % 60;

        let strMins = mins < 10 ? "0" + mins : mins;
        let strSecs = secs < 10 ? "0" + secs : secs;

        if (hrs > 0) {
            let strHrs = hrs < 10 ? "0" + hrs : hrs;
            return `${strHrs}:${strMins}:${strSecs}`;
        }
        return `${strMins}:${strSecs}`;
    }

    function parseDateStr(dateStr) {
        if(!dateStr) return null;
        if(typeof dateStr === 'number') return new Date((dateStr - (25567 + 2)) * 86400 * 1000);
        const partes = dateStr.toString().split(/[/-]/);
        if(partes.length === 3) return new Date(partes[2].length === 4 ? partes[2] : '20'+partes[2], partes[1] - 1, partes[0]);
        return new Date(dateStr);
    }

    async function loadModule(moduleName) {
        document.getElementById('loading-overlay').style.display = 'flex';
        
        document.querySelectorAll('.nav-link').forEach(btn => btn.classList.remove('active'));
        document.getElementById(moduleName.toLowerCase() + '-tab').classList.add('active');
        document.body.className = `module-${moduleName.toLowerCase()}`;

        currentModule = moduleName;

        try {
            if (!excelWorkbook) {
                const response = await fetch(EXCEL_FILE + '?v=' + new Date().getTime());
                if (!response.ok) throw new Error(`No se encontró el archivo ${EXCEL_FILE}.`);
                const arrayBuffer = await response.arrayBuffer();
                excelWorkbook = XLSX.read(arrayBuffer, {type: 'array'});
            }

            let sheetName = moduleName === 'INBOUND' ? 'Inbound' : (moduleName === 'OUTBOUND' ? 'Outbound' : 'Chat');
            if (!excelWorkbook.Sheets[sheetName]) throw new Error(`La pestaña "${sheetName}" no existe.`);

            currentData = XLSX.utils.sheet_to_json(excelWorkbook.Sheets[sheetName], {raw: false});
        } catch (error) {
            console.error("Error:", error);
            alert("Error: " + error.message);
            document.getElementById('loading-overlay').style.display = 'none';
            return;
        }
        
        configurarUI(moduleName);
        populateFilters();
        applyFilters();
        document.getElementById('loading-overlay').style.display = 'none';
    }

    function configurarUI(modulo) {
        const tHead = document.getElementById('table-head-row');
        
        if(modulo === 'INBOUND') {
            document.getElementById('card-3').style.display = 'block'; document.getElementById('card-4').style.display = 'block'; document.getElementById('card-5').style.display = 'block'; document.getElementById('card-6').style.display = 'block';
            
            document.getElementById('label-campana').innerHTML = '<i class="bi bi-funnel me-1"></i> Campaña';
            document.getElementById('label-ring').innerHTML = '<i class="bi bi-telephone me-1"></i> Ring Group';

            document.getElementById('kpi-t1').innerText = 'Recibidas'; document.getElementById('kpi-i1').className = 'bi bi-telephone-inbound-fill';
            document.getElementById('kpi-t2').innerText = 'Atendidas'; document.getElementById('kpi-i2').className = 'bi bi-check-circle-fill';
            document.getElementById('kpi-t3').innerText = 'Abandonadas'; document.getElementById('kpi-i3').className = 'bi bi-telephone-x-fill';
            document.getElementById('kpi-t4').innerText = '% Abandono'; document.getElementById('kpi-i4').className = 'bi bi-graph-down-arrow';
            document.getElementById('kpi-t6').innerText = 'AHT / ASA';
            
            tHead.innerHTML = `<th>Intervalo</th><th>Recibidas</th><th>Atendidas</th><th>Abandonadas</th><th>% Abandono</th><th>SLA Global</th><th>AHT</th><th>ASA</th>`;
        } 
        else if (modulo === 'OUTBOUND') {
            document.getElementById('card-3').style.display = 'none'; document.getElementById('card-4').style.display = 'none'; document.getElementById('card-5').style.display = 'none'; 
            
            document.getElementById('label-campana').innerHTML = '<i class="bi bi-list-task me-1"></i> Campaña';
            document.getElementById('label-ring').innerHTML = '<i class="bi bi-headset me-1"></i> Ring Group';

            document.getElementById('kpi-t1').innerText = 'Llamadas Realizadas'; document.getElementById('kpi-i1').className = 'bi bi-telephone-outbound-fill';
            document.getElementById('kpi-t2').innerText = 'AHT Global'; document.getElementById('kpi-i2').className = 'bi bi-stopwatch-fill';
            document.getElementById('card-6').style.display = 'none'; 
            
            tHead.innerHTML = `<th>Intervalo</th><th>Llamadas Realizadas</th><th>AHT</th>`;
        } 
        else if (modulo === 'CHAT') {
            document.getElementById('card-3').style.display = 'block'; document.getElementById('card-4').style.display = 'block'; document.getElementById('card-5').style.display = 'block'; document.getElementById('card-6').style.display = 'block';
            
            document.getElementById('label-campana').innerHTML = '<i class="bi bi-chat-square-text me-1"></i> Campaña';
            document.getElementById('label-ring').innerHTML = '<i class="bi bi-robot me-1"></i> Nombre del Bot';

            document.getElementById('kpi-t1').innerText = 'Chats Entrantes'; document.getElementById('kpi-i1').className = 'bi bi-chat-left-dots-fill';
            document.getElementById('kpi-t2').innerText = 'Chats Atendidos'; document.getElementById('kpi-i2').className = 'bi bi-chat-dots-fill';
            document.getElementById('kpi-t3').innerText = 'Abandonados'; document.getElementById('kpi-i3').className = 'bi bi-chat-square-quote-fill';
            document.getElementById('kpi-t4').innerText = '% Abandono'; document.getElementById('kpi-i4').className = 'bi bi-graph-down-arrow';
            document.getElementById('kpi-t6').innerText = 'AHT Global'; 
            
            tHead.innerHTML = `<th>Intervalo</th><th>Chats Entrantes</th><th>Chats Atendidos</th><th>Abandonados</th><th>% Abandono</th><th>SLA Global</th><th>AHT</th>`;
        }
    }

    function populateFilters() {
        const campanas = new Set(); const rings = new Set();
        currentData.forEach(row => {
            if(row['Campaña']) campanas.add(row['Campaña']);
            if(row['Ring Group'] || row['Nombre del Bot']) rings.add(row['Ring Group'] || row['Nombre del Bot']);
        });

        const fCamp = document.getElementById('filter-campana');
        const fRing = document.getElementById('filter-ring');
        
        fCamp.innerHTML = '<option value="ALL">Todas</option>';
        fRing.innerHTML = '<option value="ALL">Todos</option>';

        campanas.forEach(v => { fCamp.innerHTML += `<option value="${v}">${v}</option>`; });
        rings.forEach(v => { fRing.innerHTML += `<option value="${v}">${v}</option>`; });
    }

    function applyFilters() {
        const dInicio = document.getElementById('fecha-inicio').value;
        const dFin = document.getElementById('fecha-fin').value;
        const selCamp = document.getElementById('filter-campana').value;
        const selRing = document.getElementById('filter-ring').value;

        let dateStart = dInicio ? new Date(dInicio + 'T00:00:00') : null;
        let dateEnd = dFin ? new Date(dFin + 'T23:59:59') : null;

        const filteredData = currentData.filter(row => {
            let rowDate = parseDateStr(row.Fecha);
            let inDateRange = true;
            if(dateStart && rowDate < dateStart) inDateRange = false;
            if(dateEnd && rowDate > dateEnd) inDateRange = false;

            let rowCamp = row['Campaña'];
            let rowRing = row['Ring Group'] || row['Nombre del Bot'];

            return inDateRange &&
                   (selCamp === 'ALL' || rowCamp === selCamp) &&
                   (selRing === 'ALL' || rowRing === selRing);
        });
        processData(filteredData);
    }

    function processData(data) {
        let tRec = 0, tAten = 0, tSLA = 0, tAban = 0, sumAHT = 0, sumASA = 0;
        const intMap = {};

        data.forEach(row => {
            const rec = parseFloat(row['Recibidas']) || parseFloat(row['Realizadas']) || parseFloat(row['Recibidos']) || 0;
            const aten = parseFloat(row['Atendidas']) || parseFloat(row['Atendidos']) || 0;
            const atenSLA = parseFloat(row['Atendidas_SLA']) || parseFloat(row['Atendidos_SLA']) || 0;
            const aban = parseFloat(row['Abandonadas_Total']) || parseFloat(row['Abandonados']) || 0;
            const aht = parseFloat(row['AHT']) || 0;
            const asa = parseFloat(row['ASA']) || 0; 

            tRec += rec; tAten += aten; tSLA += atenSLA; tAban += aban;
            
            let baseAHT = (currentModule === 'OUTBOUND') ? rec : aten;
            sumAHT += (aht * baseAHT); 
            sumASA += (asa * aten);

            const intv = row['Intervalo'] || '00:00';
            if(!intMap[intv]) intMap[intv] = { rec: 0, aten: 0, atenSLA: 0, aban: 0, sumAHT: 0, sumASA: 0 };
            intMap[intv].rec += rec; intMap[intv].aten += aten; intMap[intv].atenSLA += atenSLA; intMap[intv].aban += aban;
            intMap[intv].sumAHT += (aht * baseAHT); intMap[intv].sumASA += (asa * aten);
        });

        const tbody = document.getElementById('tabla-body'); tbody.innerHTML = '';
        const labels = [], dRec = [], dAte = [], dAban = [];

        if (currentModule === 'OUTBOUND') {
            document.getElementById('kpi-v1').innerText = tRec.toLocaleString();
            let avgAHT = tRec > 0 ? (sumAHT / tRec) : 0;
            document.getElementById('kpi-v2').innerText = formatSeconds(avgAHT); 
            
            const sorted = Object.keys(intMap).sort();
            sorted.forEach(intv => {
                const d = intMap[intv];
                labels.push(intv); dRec.push(d.rec);
                const rAHT = d.rec > 0 ? (d.sumAHT / d.rec) : 0;
                tbody.innerHTML += `<tr><td class="fw-bold">${intv}</td><td class="text-primary fw-bold">${d.rec.toLocaleString()}</td><td class="fw-bold text-secondary">${formatSeconds(rAHT)}</td></tr>`;
            });
            renderChart(labels, dRec, [], []);
        } 
        else {
            document.getElementById('kpi-v1').innerText = tRec.toLocaleString();
            document.getElementById('kpi-v2').innerText = tAten.toLocaleString();
            document.getElementById('kpi-v3').innerText = tAban.toLocaleString();
            document.getElementById('kpi-v4').innerText = (tRec > 0 ? ((tAban / tRec) * 100).toFixed(1) : 0) + '%';
            document.getElementById('kpi-v5').innerText = (tRec > 0 ? ((tSLA / tRec) * 100).toFixed(1) : 0) + '%';
            
            let avgAHT = tAten > 0 ? (sumAHT / tAten) : 0;
            let avgASA = tAten > 0 ? (sumASA / tAten) : 0;

            if(currentModule === 'CHAT') {
                document.getElementById('kpi-v6').innerText = formatSeconds(avgAHT);
            } else {
                document.getElementById('kpi-v6').innerText = `${formatSeconds(avgAHT)} / ${formatSeconds(avgASA)}`;
            }

            const sorted = Object.keys(intMap).sort();
            sorted.forEach(intv => {
                const d = intMap[intv];
                labels.push(intv); dRec.push(d.rec); dAte.push(d.aten); dAban.push(d.aban);

                const rAba = d.rec > 0 ? ((d.aban / d.rec) * 100).toFixed(1) : 0;
                const rSLA = d.rec > 0 ? ((d.atenSLA / d.rec) * 100).toFixed(1) : 0;
                const rAHT = d.aten > 0 ? (d.sumAHT / d.aten) : 0;
                const rASA = d.aten > 0 ? (d.sumASA / d.aten) : 0;
                let slaClass = rSLA >= 80 ? 'text-success' : (rSLA >= 70 ? 'text-warning' : 'text-danger');

                let tdExtra = currentModule === 'CHAT' ? '' : `<td class="fw-semibold text-secondary">${formatSeconds(rASA)}</td>`;
                tbody.innerHTML += `<tr><td class="fw-bold">${intv}</td><td>${d.rec.toLocaleString()}</td><td class="text-success fw-bold">${d.aten.toLocaleString()}</td><td class="text-danger fw-bold">${d.aban.toLocaleString()}</td><td class="fw-semibold">${rAba}%</td><td><span class="badge-sla bg-light ${slaClass}">${rSLA}%</span></td><td class="fw-semibold text-secondary">${formatSeconds(rAHT)}</td>${tdExtra}</tr>`;
            });
            renderChart(labels, dRec, dAte, dAban);
        }
    }

    // DISEÑO ULTRA CHART.JS
    function renderChart(labels, dRec, dAte, dAban) {
        const ctx = document.getElementById('intervalChart').getContext('2d');
        if (myChart) myChart.destroy();
        
        const styles = getComputedStyle(document.body);
        const hexColor = styles.getPropertyValue('--theme-color').trim() || '#4318FF';

        let gradient = ctx.createLinearGradient(0, 0, 0, 380);
        gradient.addColorStop(0, hexColor + '40'); 
        gradient.addColorStop(1, hexColor + '00'); 

        Chart.defaults.font.family = 'Plus Jakarta Sans';
        Chart.defaults.color = '#A3AED0';

        let datasets = [];

        if (currentModule === 'OUTBOUND') {
            datasets = [{
                label: 'Llamadas Realizadas', data: dRec, borderColor: hexColor, backgroundColor: gradient,
                borderWidth: 3.5, fill: true, tension: 0.4, 
                pointBackgroundColor: '#FFFFFF', pointBorderColor: hexColor, pointBorderWidth: 3, pointRadius: 4, pointHoverRadius: 7
            }];
        } else {
            datasets = [
                {
                    label: currentModule === 'CHAT' ? 'Chats Entrantes' : 'Volumen Total', 
                    data: dRec, borderColor: hexColor, backgroundColor: gradient, borderWidth: 3.5, fill: true, tension: 0.4,
                    pointBackgroundColor: '#FFFFFF', pointBorderColor: hexColor, pointBorderWidth: 3, pointRadius: 4, pointHoverRadius: 7
                },
                {
                    label: 'Atendidos', data: dAte, borderColor: '#01B574', backgroundColor: 'transparent',
                    borderWidth: 3, fill: false, tension: 0.4, pointRadius: 0, pointHoverRadius: 6
                },
                {
                    label: 'Abandonos', data: dAban, borderColor: '#EE5D50', backgroundColor: 'transparent',
                    borderWidth: 2.5, borderDash: [6, 6], fill: false, tension: 0.4, 
                    pointRadius: 2, pointBackgroundColor: '#EE5D50', pointBorderColor: '#EE5D50'
                }
            ];
        }

        myChart = new Chart(ctx, {
            type: 'line',
            data: { labels: labels, datasets: datasets },
            options: { 
                responsive: true, maintainAspectRatio: false, 
                interaction: { mode: 'index', intersect: false },
                plugins: { 
                    legend: { position: 'top', align: 'end', labels: { usePointStyle: true, boxWidth: 10, padding: 25, font: { weight: '700', size: 12 } } },
                    tooltip: { 
                        backgroundColor: '#FFFFFF', titleColor: '#1B2559', bodyColor: '#1B2559', borderColor: '#E9EDF7', borderWidth: 1, 
                        padding: 16, boxPadding: 8, usePointStyle: true, titleFont: {size: 15, weight: '800'}, bodyFont: {size: 13, weight: '600'}, 
                        cornerRadius: 14, displayColors: true, shadowOffsetX: 0, shadowOffsetY: 10, shadowBlur: 20, shadowColor: 'rgba(112, 144, 176, 0.15)' 
                    }
                },
                scales: { 
                    y: { beginAtZero: true, border: {display: false}, grid: { color: '#F0F3F8', drawTicks: false }, ticks: { font: { weight: '600' } } }, 
                    x: { border: {display: false}, grid: { display: false, drawTicks: false }, ticks: { padding: 12, font: { weight: '600' } } } 
                }
            }
        });
    }

    document.getElementById('inbound-tab').addEventListener('click', () => loadModule('INBOUND'));
    document.getElementById('outbound-tab').addEventListener('click', () => loadModule('OUTBOUND'));
    document.getElementById('chat-tab').addEventListener('click', () => loadModule('CHAT'));

    loadModule('INBOUND');
</script>
</body>
</html>
