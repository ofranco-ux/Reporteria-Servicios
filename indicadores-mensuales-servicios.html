<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indicadores Servicios</title>
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <style>
        :root {
            --bg-body: #EBF1F5;
            --card-bg: #FFFFFF;
            --text-main: #1E293B;
            --text-muted: #64748B;
            --border-color: #E2E8F0;
            
            --blue-primary: #1D4ED8;
            --blue-cyan: #0EA5E9;
            --red-soft: #F43F5E;
            --theme-color: #1D4ED8;
        }

        body { background-color: var(--bg-body); font-family: 'Plus Jakarta Sans', sans-serif; color: var(--text-main); -webkit-font-smoothing: antialiased; }
        
        /* Header Azul Profundo */
        .navbar { background: #093986; padding: 18px 36px; box-shadow: 0 4px 15px rgba(9, 57, 134, 0.2); }
        .navbar-brand { font-weight: 800; letter-spacing: -0.5px; font-size: 1.4rem; color: #FFFFFF !important; }

        .nav-tabs { border-bottom: None; margin-bottom: 24px; gap: 10px; }
        .nav-tabs .nav-link { color: var(--text-muted); font-weight: 700; padding: 10px 22px; border: none; border-radius: 12px; transition: all 0.2s ease; font-size: 0.88rem; background: #FFFFFF; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .nav-tabs .nav-link:hover { color: var(--blue-primary); background: #F8FAFC; }
        .nav-tabs .nav-link.active { color: #FFFFFF; background: var(--blue-primary); box-shadow: 0 4px 14px rgba(29, 78, 216, 0.3); }

        .glass-panel { background: var(--card-bg); border-radius: 18px; padding: 24px; box-shadow: 0px 8px 24px rgba(149, 157, 165, 0.1); margin-bottom: 24px; border: none; transition: background-color 0.3s ease; }
        
        .form-label { font-weight: 800; font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; }
        .form-select, .form-control { border-radius: 10px; border: 1.5px solid #E2E8F0; padding: 9px 13px; font-weight: 600; font-size: 0.85rem; color: var(--text-main); background-color: #F8FAFC; }
        .form-select:focus, .form-control:focus { border-color: var(--blue-primary); box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.15); }
        
        .btn-outline-export { border: 1.5px solid #CBD5E1; color: var(--text-main); background: #FFFFFF; border-radius: 10px; padding: 7px 16px; font-weight: 700; font-size: 0.80rem; transition: all 0.2s; }
        .btn-outline-export:hover { background: #F8FAFC; border-color: #94A3B8; }

        .kpi-wrapper { display: flex; align-items: center; justify-content: space-between; overflow: hidden; }
        .kpi-info { display: flex; flex-direction: column; min-width: 0; }
        .kpi-title { font-size: 0.70rem; color: var(--text-muted); font-weight: 800; text-transform: uppercase; margin-bottom: 4px; letter-spacing: 0.6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .kpi-value { font-size: 1.70rem; font-weight: 800; color: var(--text-main); margin: 0; line-height: 1.1; letter-spacing: -0.6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color 0.3s ease;}
        .kpi-icon-box { width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.35rem; flex-shrink: 0; margin-left: 8px; transition: all 0.3s ease; }

        .section-title { font-weight: 800; font-size: 1.05rem; color: #0F172A; margin-bottom: 0; display: flex; align-items: center; letter-spacing: -0.3px; }
        
        .table-container { max-height: 420px; overflow-y: auto; border-radius: 12px; border: 1px solid #E2E8F0; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; }
        table thead th { position: sticky; top: 0; background-color: #F8FAFC !important; color: var(--text-muted) !important; font-weight: 800; font-size: 0.70rem; text-transform: uppercase; padding: 14px 16px; border-bottom: 2px solid #E2E8F0; z-index: 1; letter-spacing: 0.8px; }
        table tbody td { font-size: 0.88rem; color: #1E293B; font-weight: 600; padding: 13px 16px; border-bottom: 1px solid #F1F5F9; vertical-align: middle; }
        table tbody tr:hover { background-color: #F8FAFC; }
        
        .pill-badge { font-size: 0.75rem; padding: 4px 12px; border-radius: 20px; font-weight: 800; display: inline-block; }
        .pill-success { background-color: #DCFCE7; color: #15803D; }
        .pill-warning { background-color: #FEF3C7; color: #B45309; }
        .pill-danger { background-color: #FEE2E2; color: #B91C1C; }

        #loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; backdrop-filter: blur(8px); }
        .spinner-custom { color: #1D4ED8; width: 3.5rem; height: 3.5rem; border-width: 4px; }
    </style>
</head>
<body class="module-inbound">

<div id="loading-overlay">
    <div class="spinner-border spinner-custom" role="status"></div>
    <h6 class="mt-3 fw-bold" style="color: #0F172A;">Cargando Dashboard...</h6>
</div>

<nav class="navbar navbar-expand-lg">
    <div class="container-fluid px-4">
        <a class="navbar-brand d-flex align-items-center" href="#">
            <i class="bi bi-bar-chart-line-fill me-2 text-white"></i> Indicadores Servicios
        </a>
    </div>
</nav>

<div class="container-fluid px-4 pb-5 pt-4">
    
    <ul class="nav nav-tabs" id="myTab" role="tablist">
        <li class="nav-item"><button class="nav-link active" id="inbound-tab"><i class="bi bi-headset me-2"></i> Inbound</button></li>
        <li class="nav-item"><button class="nav-link" id="outbound-tab"><i class="bi bi-telephone-outbound me-2"></i> Outbound</button></li>
        <li class="nav-item"><button class="nav-link" id="chat-tab"><i class="bi bi-chat-dots me-2"></i> Chat Digital</button></li>
    </ul>

    <!-- Panel de Filtros Automáticos -->
    <div class="glass-panel">
        <div class="row align-items-end g-3">
            <div class="col-md-3">
                <label class="form-label"><i class="bi bi-calendar-event me-1"></i> Desde</label>
                <input type="date" id="fecha-inicio" class="form-control">
            </div>
            <div class="col-md-3">
                <label class="form-label"><i class="bi bi-calendar-event me-1"></i> Hasta</label>
                <input type="date" id="fecha-fin" class="form-control">
            </div>
            <div class="col-md-3">
                <label class="form-label" id="label-campana"><i class="bi bi-funnel me-1"></i> Campaña</label>
                <select id="filter-campana" class="form-select"><option value="ALL">Todas</option></select>
            </div>
            <div class="col-md-3">
                <label class="form-label" id="label-ring"><i class="bi bi-telephone me-1"></i> Ring Group</label>
                <select id="filter-ring" class="form-select"><option value="ALL">Todos</option></select>
            </div>
        </div>
    </div>

    <!-- KPIs -->
    <div class="row g-3 mb-4" id="kpi-container">
        <div class="col-xl-2 col-md-4 col-sm-6" id="card-1"><div class="glass-panel p-3 h-100 kpi-wrapper bg-white"><div class="kpi-info"><span class="kpi-title" id="kpi-t1">Recibidas</span><span class="kpi-value" id="kpi-v1">0</span></div><div class="kpi-icon-box" style="background:#F1F5F9; color:#475569;"><i id="kpi-i1" class="bi bi-telephone-inbound-fill"></i></div></div></div>
        <div class="col-xl-2 col-md-4 col-sm-6" id="card-2"><div class="glass-panel p-3 h-100 kpi-wrapper bg-white"><div class="kpi-info"><span class="kpi-title" id="kpi-t2">Atendidas</span><span class="kpi-value" id="kpi-v2">0</span></div><div class="kpi-icon-box" style="background:#F1F5F9; color:#475569;"><i id="kpi-i2" class="bi bi-check-circle-fill"></i></div></div></div>
        <div class="col-xl-2 col-md-4 col-sm-6" id="card-3"><div class="glass-panel p-3 h-100 kpi-wrapper bg-white"><div class="kpi-info"><span class="kpi-title" id="kpi-t3">Pérdidas</span><span class="kpi-value" id="kpi-v3">0</span></div><div class="kpi-icon-box" style="background:#F1F5F9; color:#475569;"><i id="kpi-i3" class="bi bi-telephone-x-fill"></i></div></div></div>
        
        <div class="col-xl-2 col-md-4 col-sm-6" id="card-4"><div class="glass-panel p-3 h-100 kpi-wrapper" id="card-4-inner"><div class="kpi-info"><span class="kpi-title" id="kpi-t4">% Abandono</span><span class="kpi-value" id="kpi-v4">0%</span></div><div class="kpi-icon-box" id="kpi-i4-box"><i id="kpi-i4" class="bi bi-graph-down-arrow"></i></div></div></div>
        <div class="col-xl-2 col-md-4 col-sm-6" id="card-5"><div class="glass-panel p-3 h-100 kpi-wrapper" id="card-5-inner"><div class="kpi-info"><span class="kpi-title" id="kpi-t5">SLA Global</span><span class="kpi-value" id="kpi-v5">0%</span></div><div class="kpi-icon-box" id="kpi-i5-box"><i id="kpi-i5" class="bi bi-award-fill"></i></div></div></div>
        
        <div class="col-xl-2 col-md-4 col-sm-6" id="card-6"><div class="glass-panel p-3 h-100 kpi-wrapper bg-white"><div class="kpi-info"><span class="kpi-title" id="kpi-t6">AHT / ASA</span><span class="kpi-value fs-6" id="kpi-v6">00:00 / 00:00</span></div><div class="kpi-icon-box" style="background:#F1F5F9; color:#475569;"><i id="kpi-i6" class="bi bi-clock-history"></i></div></div></div>
    </div>

    <!-- Gráfica -->
    <div class="row mb-4">
        <div class="col-12"><div class="glass-panel pb-3">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="section-title"><i class="bi bi-bar-chart-fill me-2 fs-5" style="color:#1D4ED8;"></i> Tendencia Operativa por Intervalo</h5>
            </div>
            <div style="height: 380px; width: 100%; position: relative;"><canvas id="intervalChart"></canvas></div>
        </div></div>
    </div>

    <!-- Tabla -->
    <div class="row">
        <div class="col-12"><div class="glass-panel">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="section-title"><i class="bi bi-table me-2 fs-5" style="color:#1D4ED8;"></i> Desglose Detallado por Intervalo (30 Min)</h5>
                <button class="btn btn-outline-export" onclick="exportTableToCSV()">
                    <i class="bi bi-download me-1"></i> Descargar Excel
                </button>
            </div>
            <div class="table-container">
                <table class="table text-center" id="data-table">
                    <thead><tr id="table-head-row"></tr></thead>
                    <tbody id="tabla-body"></tbody>
                </table>
            </div>
        </div></div>
    </div>
</div>

<script>
    const EXCEL_FILE = 'Indicadores Mensuales Servicios.xlsx'; 
    
    let excelWorkbook = null; 
    let myChart = null; 
    let currentData = [];
    let currentFilteredIntervalData = []; 
    let currentModule = 'INBOUND';

    // Eventos automáticos
    document.getElementById('fecha-inicio').addEventListener('change', applyFilters);
    document.getElementById('fecha-fin').addEventListener('change', applyFilters);
    document.getElementById('filter-campana').addEventListener('change', applyFilters);
    document.getElementById('filter-ring').addEventListener('change', applyFilters);

    function formatSeconds(seconds) {
        if (isNaN(seconds) || seconds === null || seconds === undefined) return "00:00";
        let s = Math.round(parseFloat(seconds));
        if (s <= 0) return "00:00";

        let hrs = Math.floor(s / 3600);
        let mins = Math.floor((s % 3600) / 60);
        let secs = s % 60;

        let strMins = mins < 10 ? "0" + mins : mins;
        let strSecs = secs < 10 ? "0" + secs : secs;

        if (hrs > 0) {
            let strHrs = hrs < 10 ? "0" + hrs : hrs;
            return `${strHrs}:${strMins}:${strSecs}`;
        }
        return `${strMins}:${strSecs}`;
    }

    function parseDateStr(dateStr) {
        if(!dateStr) return null;
        if(typeof dateStr === 'number') return new Date((dateStr - (25567 + 2)) * 86400 * 1000);
        const partes = dateStr.toString().split(/[/-]/);
        if(partes.length === 3) return new Date(partes[2].length === 4 ? partes[2] : '20'+partes[2], partes[1] - 1, partes[0]);
        return new Date(dateStr);
    }

    function timeToMinutes(timeStr) {
        if (!timeStr) return 0;
        let str = timeStr.toString().trim();
        let parts = str.split(':');
        if (parts.length >= 2) {
            let h = parseInt(parts[0], 10) || 0;
            let m = parseInt(parts[1], 10) || 0;
            return h * 60 + m;
        }
        return 0;
    }

    async function loadModule(moduleName) {
        document.getElementById('loading-overlay').style.display = 'flex';
        
        document.querySelectorAll('.nav-link').forEach(btn => btn.classList.remove('active'));
        document.getElementById(moduleName.toLowerCase() + '-tab').classList.add('active');
        document.body.className = `module-${moduleName.toLowerCase()}`;

        currentModule = moduleName;

        try {
            if (!excelWorkbook) {
                const response = await fetch(EXCEL_FILE + '?v=' + new Date().getTime());
                if (!response.ok) throw new Error(`No se encontró el archivo ${EXCEL_FILE}.`);
                const arrayBuffer = await response.arrayBuffer();
                excelWorkbook = XLSX.read(arrayBuffer, {type: 'array'});
            }

            let sheetName = moduleName === 'INBOUND' ? 'Inbound' : (moduleName === 'OUTBOUND' ? 'Outbound' : 'Chat');
            if (!excelWorkbook.Sheets[sheetName]) throw new Error(`La pestaña "${sheetName}" no existe.`);

            currentData = XLSX.utils.sheet_to_json(excelWorkbook.Sheets[sheetName], {raw: false});
        } catch (error) {
            console.error("Error:", error);
            alert("Error: " + error.message);
            document.getElementById('loading-overlay').style.display = 'none';
            return;
        }
        
        configurarUI(moduleName);
        populateFilters();
        applyFilters();
        document.getElementById('loading-overlay').style.display = 'none';
    }

    function configurarUI(modulo) {
        const tHead = document.getElementById('table-head-row');
        
        if(modulo === 'INBOUND') {
            document.getElementById('card-3').style.display = 'block'; document.getElementById('card-4').style.display = 'block'; document.getElementById('card-5').style.display = 'block'; document.getElementById('card-6').style.display = 'block';
            
            document.getElementById('label-campana').innerHTML = '<i class="bi bi-funnel me-1"></i> Campaña';
            document.getElementById('label-ring').innerHTML = '<i class="bi bi-telephone me-1"></i> Ring Group';

            document.getElementById('kpi-t1').innerText = 'Recibidas'; document.getElementById('kpi-i1').className = 'bi bi-telephone-inbound-fill';
            document.getElementById('kpi-t2').innerText = 'Atendidas'; document.getElementById('kpi-i2').className = 'bi bi-check-circle-fill';
            document.getElementById('kpi-t3').innerText = 'Abandonadas'; document.getElementById('kpi-i3').className = 'bi bi-telephone-x-fill';
            document.getElementById('kpi-t4').innerText = '% Abandono'; document.getElementById('kpi-i4').className = 'bi bi-graph-down-arrow';
            document.getElementById('kpi-t6').innerText = 'AHT / ASA';
            
            tHead.innerHTML = `<th>Intervalo</th><th>Recibidas</th><th>Atendidas</th><th>Abandonadas</th><th>% Abandono</th><th>SLA Global</th><th>AHT</th><th>ASA</th>`;
        } 
        else if (modulo === 'OUTBOUND') {
            document.getElementById('card-3').style.display = 'none'; document.getElementById('card-4').style.display = 'none'; document.getElementById('card-5').style.display = 'none'; 
            
            document.getElementById('label-campana').innerHTML = '<i class="bi bi-list-task me-1"></i> Campaña';
            document.getElementById('label-ring').innerHTML = '<i class="bi bi-headset me-1"></i> Ring Group';

            document.getElementById('kpi-t1').innerText = 'Llamadas Realizadas'; document.getElementById('kpi-i1').className = 'bi bi-telephone-outbound-fill';
            document.getElementById('kpi-t2').innerText = 'AHT Global'; document.getElementById('kpi-i2').className = 'bi bi-clock-history';
            document.getElementById('card-6').style.display = 'none'; 
            
            tHead.innerHTML = `<th>Intervalo</th><th>Llamadas Realizadas</th><th>AHT</th>`;
        } 
        else if (modulo === 'CHAT') {
            document.getElementById('card-3').style.display = 'block'; document.getElementById('card-4').style.display = 'block'; document.getElementById('card-5').style.display = 'block'; document.getElementById('card-6').style.display = 'block';
            
            document.getElementById('label-campana').innerHTML = '<i class="bi bi-chat-square-text me-1"></i> Campaña';
            document.getElementById('label-ring').innerHTML = '<i class="bi bi-robot me-1"></i> Nombre del Bot';

            document.getElementById('kpi-t1').innerText = 'Chats Entrantes'; document.getElementById('kpi-i1').className = 'bi bi-chat-left-dots-fill';
            document.getElementById('kpi-t2').innerText = 'Chats Atendidos'; document.getElementById('kpi-i2').className = 'bi bi-chat-dots-fill';
            document.getElementById('kpi-t3').innerText = 'Abandonados'; document.getElementById('kpi-i3').className = 'bi bi-chat-square-quote-fill';
            document.getElementById('kpi-t4').innerText = '% Abandono'; document.getElementById('kpi-i4').className = 'bi bi-graph-down-arrow';
            document.getElementById('kpi-t6').innerText = 'AHT Global'; 
            
            tHead.innerHTML = `<th>Intervalo</th><th>Chats Entrantes</th><th>Chats Atendidos</th><th>Abandonados</th><th>% Abandono</th><th>SLA Global</th><th>AHT</th>`;
        }
    }

    function populateFilters() {
        const valCamp = document.getElementById('filter-campana').value;
        const valRing = document.getElementById('filter-ring').value;

        const campanas = new Set(); const rings = new Set();
        currentData.forEach(row => {
            if(row['Campaña']) campanas.add(row['Campaña']);
            if(row['Ring Group'] || row['Nombre del Bot']) rings.add(row['Ring Group'] || row['Nombre del Bot']);
        });

        const fCamp = document.getElementById('filter-campana');
        const fRing = document.getElementById('filter-ring');
        
        fCamp.innerHTML = '<option value="ALL">Todas</option>';
        fRing.innerHTML = '<option value="ALL">Todos</option>';

        campanas.forEach(v => { 
            let selected = (v === valCamp) ? 'selected' : '';
            fCamp.innerHTML += `<option value="${v}" ${selected}>${v}</option>`; 
        });
        rings.forEach(v => { 
            let selected = (v === valRing) ? 'selected' : '';
            fRing.innerHTML += `<option value="${v}" ${selected}>${v}</option>`; 
        });
    }

    function applyFilters() {
        const dInicio = document.getElementById('fecha-inicio').value;
        const dFin = document.getElementById('fecha-fin').value;
        const selCamp = document.getElementById('filter-campana').value;
        const selRing = document.getElementById('filter-ring').value;

        let dateStart = dInicio ? new Date(dInicio + 'T00:00:00') : null;
        let dateEnd = dFin ? new Date(dFin + 'T23:59:59') : null;

        const filteredData = currentData.filter(row => {
            let rowDate = parseDateStr(row.Fecha);
            let inDateRange = true;
            if(dateStart && rowDate < dateStart) inDateRange = false;
            if(dateEnd && rowDate > dateEnd) inDateRange = false;

            let rowCamp = row['Campaña'];
            let rowRing = row['Ring Group'] || row['Nombre del Bot'];

            return inDateRange &&
                   (selCamp === 'ALL' || rowCamp === selCamp) &&
                   (selRing === 'ALL' || rowRing === selRing);
        });
        processData(filteredData);
    }

    function processData(data) {
        let tRec = 0, tAten = 0, tSLA = 0, tAban = 0, sumAHT = 0, sumASA = 0;
        const intMap = {};

        data.forEach(row => {
            let rec = parseFloat(row['Recibidas']) || parseFloat(row['Realizadas']) || parseFloat(row['Recibidos']) || 0;
            const aten = parseFloat(row['Atendidas']) || parseFloat(row['Atendidos']) || 0;
            const atenSLA = parseFloat(row['Atendidas_SLA']) || parseFloat(row['Atendidos_SLA']) || 0;
            const aban = parseFloat(row['Abandonadas_Total']) || parseFloat(row['Abandonados']) || 0;
            const aht = parseFloat(row['AHT']) || 0;
            const asa = parseFloat(row['ASA']) || 0; 

            if (currentModule !== 'OUTBOUND' && rec < (aten + aban)) {
                rec = aten + aban;
            }

            tRec += rec; tAten += aten; tSLA += atenSLA; tAban += aban;
            
            let baseAHT = (currentModule === 'OUTBOUND') ? rec : aten;
            sumAHT += (aht * baseAHT); 
            sumASA += (asa * aten);

            let rawIntv = row['Intervalo'] || '00:00';
            let formattedIntv = rawIntv.toString().trim();
            if(formattedIntv.length === 4 && formattedIntv.includes(':')) formattedIntv = '0' + formattedIntv;

            if(!intMap[formattedIntv]) intMap[formattedIntv] = { rec: 0, aten: 0, atenSLA: 0, aban: 0, sumAHT: 0, sumASA: 0 };
            intMap[formattedIntv].rec += rec; intMap[formattedIntv].aten += aten; intMap[formattedIntv].atenSLA += atenSLA; intMap[formattedIntv].aban += aban;
            intMap[formattedIntv].sumAHT += (aht * baseAHT); intMap[formattedIntv].sumASA += (asa * aten);
        });

        const tbody = document.getElementById('tabla-body'); tbody.innerHTML = '';
        const labels = [], dRec = [], dAte = [], dAban = [], dSLA = [], dPctAban = [];
        currentFilteredIntervalData = []; 

        const sortedIntervals = Object.keys(intMap).sort((a, b) => timeToMinutes(a) - timeToMinutes(b));

        if (currentModule === 'OUTBOUND') {
            document.getElementById('kpi-v1').innerText = tRec.toLocaleString();
            let avgAHT = tRec > 0 ? (sumAHT / tRec) : 0;
            document.getElementById('kpi-v2').innerText = formatSeconds(avgAHT); 
            
            sortedIntervals.forEach(intv => {
                const d = intMap[intv];
                labels.push(intv); dRec.push(d.rec);
                const rAHT = d.rec > 0 ? (d.sumAHT / d.rec) : 0;
                
                tbody.innerHTML += `<tr><td class="fw-bold">${intv}</td><td class="fw-bold" style="color:#1D4ED8;">${d.rec.toLocaleString()}</td><td class="fw-bold text-secondary">${formatSeconds(rAHT)}</td></tr>`;
                
                currentFilteredIntervalData.push({
                    "Intervalo": intv,
                    "Llamadas Realizadas": d.rec,
                    "AHT": formatSeconds(rAHT)
                });
            });
            renderChart(labels, dRec, [], [], [], []);
        } 
        else {
            document.getElementById('kpi-v1').innerText = tRec.toLocaleString();
            document.getElementById('kpi-v2').innerText = tAten.toLocaleString();
            document.getElementById('kpi-v3').innerText = tAban.toLocaleString();
            
            let rAbaGlobal = tRec > 0 ? (tAban / tRec) * 100 : 0;
            let rSLAGlobal = tRec > 0 ? (tSLA / tRec) * 100 : 0;
            
            document.getElementById('kpi-v4').innerText = rAbaGlobal.toFixed(1) + '%';
            document.getElementById('kpi-v5').innerText = rSLAGlobal.toFixed(1) + '%';

            // Formato Condicional % Abandono
            const card4Inner = document.getElementById('card-4-inner');
            const val4 = document.getElementById('kpi-v4');
            const icon4Box = document.getElementById('kpi-i4-box');
            if (rAbaGlobal <= 3.0) {
                card4Inner.style.backgroundColor = '#F0FDF4'; 
                val4.style.color = '#15803D';
                icon4Box.style.backgroundColor = '#DCFCE7';
                icon4Box.style.color = '#15803D';
            } else {
                card4Inner.style.backgroundColor = '#FEF2F2'; 
                val4.style.color = '#B91C1C';
                icon4Box.style.backgroundColor = '#FEE2E2';
                icon4Box.style.color = '#B91C1C';
            }

            // Formato Condicional SLA Global
            const card5Inner = document.getElementById('card-5-inner');
            const val5 = document.getElementById('kpi-v5');
            const icon5Box = document.getElementById('kpi-i5-box');
            if (rSLAGlobal >= 80.0) {
                card5Inner.style.backgroundColor = '#F0FDF4'; 
                val5.style.color = '#15803D';
                icon5Box.style.backgroundColor = '#DCFCE7';
                icon5Box.style.color = '#15803D';
            } else {
                card5Inner.style.backgroundColor = '#FEF2F2'; 
                val5.style.color = '#B91C1C';
                icon5Box.style.backgroundColor = '#FEE2E2';
                icon5Box.style.color = '#B91C1C';
            }
            
            let avgAHT = tAten > 0 ? (sumAHT / tAten) : 0;
            let avgASA = tAten > 0 ? (sumASA / tAten) : 0;

            if(currentModule === 'CHAT') {
                document.getElementById('kpi-v6').innerText = formatSeconds(avgAHT);
            } else {
                document.getElementById('kpi-v6').innerText = `${formatSeconds(avgAHT)} / ${formatSeconds(avgASA)}`;
            }

            sortedIntervals.forEach(intv => {
                const d = intMap[intv];
                labels.push(intv); dRec.push(d.rec); dAte.push(d.aten); dAban.push(d.aban);

                const rAba = d.rec > 0 ? parseFloat(((d.aban / d.rec) * 100).toFixed(1)) : 0;
                dPctAban.push(rAba);

                const rSLA = d.rec > 0 ? parseFloat(((d.atenSLA / d.rec) * 100).toFixed(1)) : 0;
                dSLA.push(rSLA);

                const rAHT = d.aten > 0 ? (d.sumAHT / d.aten) : 0;
                const rASA = d.aten > 0 ? (d.sumASA / d.aten) : 0;
                
                let pillClass = rSLA >= 80 ? 'pill-success' : (rSLA >= 70 ? 'pill-warning' : 'pill-danger');

                let tdExtra = currentModule === 'CHAT' ? '' : `<td class="fw-semibold text-secondary">${formatSeconds(rASA)}</td>`;
                tbody.innerHTML += `<tr><td class="fw-bold">${intv}</td><td>${d.rec.toLocaleString()}</td><td class="fw-bold" style="color:#0EA5E9;">${d.aten.toLocaleString()}</td><td class="text-danger fw-bold">${d.aban.toLocaleString()}</td><td class="fw-semibold">${rAba}%</td><td><span class="pill-badge ${pillClass}">${rSLA}%</span></td><td class="fw-semibold text-secondary">${formatSeconds(rAHT)}</td>${tdExtra}</tr>`;

                let exportRow = {
                    "Intervalo": intv,
                    [currentModule === 'CHAT' ? "Chats Entrantes" : "Recibidas"]: d.rec,
                    [currentModule === 'CHAT' ? "Chats Atendidos" : "Atendidas"]: d.aten,
                    "Abandonadas": d.aban,
                    "% Abandono": `${rAba}%`,
                    "SLA Global": `${rSLA}%`,
                    "AHT": formatSeconds(rAHT)
                };
                if(currentModule !== 'CHAT') exportRow["ASA"] = formatSeconds(rASA);
                currentFilteredIntervalData.push(exportRow);
            });
            renderChart(labels, dRec, dAte, dAban, dSLA, dPctAban);
        }
    }

    function renderChart(labels, dRec, dAte, dAban, dSLA, dPctAban) {
        const ctx = document.getElementById('intervalChart').getContext('2d');
        if (myChart) myChart.destroy();

        Chart.defaults.font.family = 'Plus Jakarta Sans';
        Chart.defaults.color = '#94A3B8';

        let datasets = [];

        if (currentModule === 'OUTBOUND') {
            datasets = [{
                type: 'bar',
                label: 'Llamadas Realizadas', 
                data: dRec, 
                backgroundColor: '#1D4ED8',
                borderRadius: 6,
                barPercentage: 0.85,
                categoryPercentage: 0.85,
                grouped: false,
                yAxisID: 'y'
            }];
        } else if (currentModule === 'CHAT') {
            datasets = [
                {
                    type: 'bar',
                    label: 'Chats Entrantes', 
                    data: dRec, 
                    backgroundColor: '#E0F2FE', 
                    borderRadius: 6,
                    barPercentage: 0.85,
                    categoryPercentage: 0.85,
                    grouped: false,
                    yAxisID: 'y',
                    order: 2
                },
                {
                    type: 'bar',
                    label: 'Chats Atendidos', 
                    data: dAte, 
                    backgroundColor: '#0284C7', 
                    borderRadius: 6,
                    barPercentage: 0.85,
                    categoryPercentage: 0.85,
                    grouped: false,
                    yAxisID: 'y',
                    order: 1
                },
                {
                    type: 'line',
                    label: 'SLA (%)', 
                    data: dSLA, 
                    borderColor: '#10B981', 
                    backgroundColor: '#10B981',
                    borderWidth: 2.5, 
                    fill: false, 
                    tension: 0.35, 
                    pointRadius: 3,
                    pointHoverRadius: 6,
                    yAxisID: 'y1',
                    order: 0
                },
                {
                    type: 'line',
                    label: '% Abandono', 
                    data: dPctAban, 
                    borderColor: '#F43F5E', 
                    backgroundColor: '#F43F5E',
                    borderWidth: 2, 
                    borderDash: [4, 4], 
                    fill: false, 
                    tension: 0.35, 
                    pointRadius: 2,
                    yAxisID: 'y1',
                    order: 0
                }
            ];
        } else {
            datasets = [
                {
                    type: 'bar',
                    label: 'Volumen Recibido', 
                    data: dRec, 
                    backgroundColor: '#DBEAFE', 
                    borderRadius: 6,
                    barPercentage: 0.85,
                    categoryPercentage: 0.85,
                    grouped: false,
                    yAxisID: 'y',
                    order: 2
                },
                {
                    type: 'bar',
                    label: 'Atendidas', 
                    data: dAte, 
                    backgroundColor: '#1D4ED8', 
                    borderRadius: 6,
                    barPercentage: 0.85,
                    categoryPercentage: 0.85,
                    grouped: false,
                    yAxisID: 'y',
                    order: 1
                },
                {
                    type: 'line',
                    label: 'Nivel Servicio (%)', 
                    data: dSLA, 
                    borderColor: '#10B981', 
                    backgroundColor: '#10B981',
                    borderWidth: 2.5, 
                    fill: false, 
                    tension: 0.35, 
                    pointRadius: 3,
                    pointHoverRadius: 6,
                    yAxisID: 'y1',
                    order: 0
                },
                {
                    type: 'line',
                    label: '% Abandono', 
                    data: dPctAban, 
                    borderColor: '#F43F5E', 
                    backgroundColor: '#F43F5E',
                    borderWidth: 2, 
                    borderDash: [4, 4], 
                    fill: false, 
                    tension: 0.35, 
                    pointRadius: 2,
                    yAxisID: 'y1',
                    order: 0
                }
            ];
        }

        myChart = new Chart(ctx, {
            data: { labels: labels, datasets: datasets },
            options: { 
                responsive: true, maintainAspectRatio: false, 
                interaction: { mode: 'index', intersect: false },
                plugins: { 
                    legend: { position: 'top', align: 'end', labels: { usePointStyle: true, boxWidth: 8, padding: 20, font: { weight: '800', size: 12 } } },
                    tooltip: { 
                        backgroundColor: '#FFFFFF', titleColor: '#0F172A', bodyColor: '#0F172A', borderColor: '#E2E8F0', borderWidth: 1, 
                        padding: 14, boxPadding: 6, usePointStyle: true, titleFont: {size: 13, weight: '800'}, bodyFont: {size: 12, weight: '600'}, 
                        cornerRadius: 12, displayColors: true, shadowOffsetX: 0, shadowOffsetY: 10, shadowBlur: 20, shadowColor: 'rgba(0, 0, 0, 0.08)',
                        callbacks: {
                            label: function(context) {
                                let label = context.dataset.label || '';
                                if (label) label += ': ';
                                if (context.dataset.yAxisID === 'y1') {
                                    label += context.parsed.y + '%';
                                } else {
                                    label += context.parsed.y.toLocaleString();
                                }
                                return label;
                            }
                        }
                    }
                },
                scales: { 
                    y: { 
                        type: 'linear', display: true, position: 'left', beginAtZero: true, 
                        border: {display: false}, grid: { color: '#F1F5F9', drawTicks: false }, 
                        ticks: { font: { weight: '700' } } 
                    },
                    y1: { 
                        type: 'linear', display: (currentModule !== 'OUTBOUND'), position: 'right', beginAtZero: true, max: 120,
                        border: {display: false}, grid: { drawOnChartArea: false, drawTicks: false }, 
                        ticks: { font: { weight: '700' }, stepSize: 20, callback: function(value) { return value + '%'; } } 
                    },
                    x: { border: {display: false}, grid: { display: false, drawTicks: false }, ticks: { padding: 10, font: { weight: '700', size: 10 } } } 
                }
            }
        });
    }

    function exportTableToCSV() {
        if(!currentFilteredIntervalData || currentFilteredIntervalData.length === 0) {
            alert("No hay datos cargados para exportar.");
            return;
        }

        const ws = XLSX.utils.json_to_sheet(currentFilteredIntervalData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Intervalos_30min");

        const fileName = `Reporte_${currentModule}_Intervalos_30min.xlsx`;
        XLSX.writeFile(wb, fileName);
    }

    document.getElementById('inbound-tab').addEventListener('click', () => loadModule('INBOUND'));
    document.getElementById('outbound-tab').addEventListener('click', () => loadModule('OUTBOUND'));
    document.getElementById('chat-tab').addEventListener('click', () => loadModule('CHAT'));

    loadModule('INBOUND');
</script>
</body>
</html>
